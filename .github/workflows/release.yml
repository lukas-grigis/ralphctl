name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    name: Publish & Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      # Tag / version / changelog gates run FIRST: none of them needs node_modules, and a bad
      # tag or a missing release-notes heading should fail in seconds rather than after a full
      # install + test + build. Critically, they must all pass BEFORE `Publish to npm` — an npm
      # publish is irreversible, so nothing that can reject the release may run after it.
      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # No git-log fallback: a commit-subject dump is not release notes, and silently
      # substituting one hid the real defect (nobody wrote the changelog section) until after
      # the package was already public. Missing heading and empty body are separate messages
      # because they have separate fixes.
      - name: Extract and validate changelog section
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if ! grep -qF "## [${VERSION}]" CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::No '## [${VERSION}]' heading in CHANGELOG.md — write the release notes before tagging."
            exit 1
          fi
          # `marker` is matched as a literal-prefix string (index(...) == 1) rather than a
          # regex — `## [x.y.z]` contains `[`/`]` regex metacharacters that would otherwise
          # turn the marker into a single-char class and silently match nothing.
          SECTION=$(awk -v marker="## [${VERSION}]" '
            index($0, marker) == 1 { found=1; next }
            found && substr($0, 1, 4) == "## [" { exit }
            found { print }
          ' CHANGELOG.md)

          if [ -z "$(printf '%s' "$SECTION" | tr -d '[:space:]')" ]; then
            echo "::error file=CHANGELOG.md::The '## [${VERSION}]' section is empty — write the release notes before tagging."
            exit 1
          fi

          {
            echo "notes<<EOF"
            echo "$SECTION"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Dead code (knip)
        run: pnpm deadcode

      # `pnpm coverage`, not `pnpm test`: the release must run the same regression floors CI
      # gates PRs on, otherwise a release can ship coverage CI would have rejected.
      - name: Test (with coverage thresholds)
        run: pnpm coverage

      - name: Build
        run: pnpm build

      - name: Verify dist
        run: node dist/cli.mjs --version

      # Mirrors ci.yml — `--version` never reaches `runBundleIntegrityCheck`, so it cannot
      # catch a broken bundled-asset layout. The release gate must not be weaker than CI.
      - name: Verify dist boots a real subcommand (bundle integrity)
        env:
          RALPHCTL_HOME: ${{ runner.temp }}/ralphctl-dist-smoke
        run: |
          skills=$(node dist/cli.mjs skills list)
          printf '%s\n' "$skills" | grep -q '^ralphctl-alignment'
          agents=$(node dist/cli.mjs agents list)
          printf '%s\n' "$agents" | grep -q '^ralphctl-evaluator'
          prompts=$(node dist/cli.mjs prompts list)
          printf '%s\n' "$prompts" | grep -q '^implement'

      # Not redundant with the step above, and the last gate before the irreversible publish:
      # `node dist/cli.mjs` resolves commander / react / ink / zod / cross-spawn / proper-lockfile /
      # typescript-result from the REPO's node_modules (tsup leaves every dependency external), so a
      # runtime dep demoted to devDependencies — or anything the `files` allowlist drops — boots fine
      # on the runner and then fails on every real `npm i ralphctl`. Only a pack + install into a
      # clean prefix exercises that resolution, the bin link and the packaging layer.
      # `npm i --prefix <abs path>`, never `cd && npm i`. The stub package.json at the prefix is
      # load-bearing — without one npm walks up and installs into the repo tree — and it is written
      # by hand rather than by `npm init -y`, which ignores `--prefix` and would rewrite the repo's
      # OWN package.json moments before publish. Packing to /tmp keeps the .tgz outside the workspace
      # so it cannot be swept into the tarball `pnpm publish` builds.
      - name: Verify npm pack installs correctly
        env:
          RALPHCTL_HOME: ${{ runner.temp }}/ralphctl-pack-smoke
        run: |
          TARBALL=$(pnpm pack --pack-destination /tmp 2>/dev/null | tail -1)
          SMOKE=/tmp/ralphctl-release-smoke
          mkdir -p "$SMOKE"
          printf '{"name":"ralphctl-release-smoke","version":"0.0.0","private":true}\n' > "$SMOKE"/package.json
          npm install --prefix "$SMOKE" "$TARBALL"
          BIN="$SMOKE"/node_modules/.bin/ralphctl
          version=$("$BIN" --version)
          printf '%s\n' "$version" | grep -qF "${{ steps.version.outputs.version }}"
          skills=$("$BIN" skills list)
          printf '%s\n' "$skills" | grep -q '^ralphctl-alignment'
          agents=$("$BIN" agents list)
          printf '%s\n' "$agents" | grep -q '^ralphctl-evaluator'
          prompts=$("$BIN" prompts list)
          printf '%s\n' "$prompts" | grep -q '^implement'

      - name: Publish to npm
        run: pnpm publish --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: v${{ steps.version.outputs.version }}
          tag_name: ${{ github.ref_name }}
          body: |
            ## What's changed

            ${{ steps.changelog.outputs.notes }}

            ---
            **Full changelog:** https://github.com/${{ github.repository }}/compare/${{ github.ref_name }}...HEAD
            **npm:** https://www.npmjs.com/package/ralphctl/v/${{ steps.version.outputs.version }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
